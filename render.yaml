
services:
  - type: web
    name: debatecheck
    runtime: docker
    plan: free
    branch: person-5
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: GOOGLE_API_KEY
        sync: false
      - key: DEBATECHECK_API_URL
        value: http://127.0.0.1:8002

